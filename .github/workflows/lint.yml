name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# NOTE: no test/static-analysis job — both runtime dependencies come from
# license-gated composer repositories (satis.ralphjsmit.com for the media
# library, packages.filamentphp.com for Filament), so `composer install` cannot
# run on a public runner without a COMPOSER_AUTH secret. Pint is installed
# globally instead, and the feature/browser tests live in the consuming app.
jobs:
  code-style:
    name: Pint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install Pint
        run: composer global require laravel/pint --no-interaction --no-progress

      - name: Check code style
        run: $(composer global config bin-dir --absolute --quiet)/pint --test
